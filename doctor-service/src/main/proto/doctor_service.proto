syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.healthcare.doctor_service.service.grpc";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";


service DoctorService{
    rpc CreateDoctor (CreateDoctorRequest) returns (CreateDoctorResponse);
    rpc GetDoctors(Empty) returns (DoctorList);
    rpc GetDoctorsBySpecialization(Specialization) returns (DoctorList);
}

service AvailableService{
    rpc AddAvailability(AddAvailabilityRequest) returns (AddAvailabilityResponse);
    rpc GetAvailability(GetAvailabilityRequest) returns (SlotList);
    rpc BookSlot(BookSlotRequest) returns (BookSlotResponse);
}

message Empty {}

message BookSlotResponse{
    bool exist = 1;
}

message BookSlotRequest{
    int64 slot_id = 1;
}

message GetAvailabilityRequest{
    string doctor_id = 1;
}

message AddAvailabilityRequest{
    string doctor_id = 1;
    google.protobuf.Timestamp start_time = 2;
    google.protobuf.Duration duration = 3;
}

message AddAvailabilityResponse{
    int64 slot_id = 1;
    google.protobuf.Timestamp start_time = 2;
    google.protobuf.Timestamp end_time = 3;
}

message Specialization{
    string specialization = 1;
}

message CreateDoctorRequest{
    string first_name = 1;
    string last_name = 2;
    string specialization = 3;
    string country_code = 4;
    string phone_number = 5;
}

message CreateDoctorResponse{
    string doctor_id = 1;
    string full_name = 2;
    string specialization = 3;
    string phone_number = 4;
}

message Doctor{
    string doctor_id = 1;
    string first_name = 2;
    string last_name = 3;
    string specialization = 4;
    string country_code = 5;
    string phone_number = 6;
    repeated Slot availability_slots = 7;
}

message Slot{
    int64 slot_id = 1;
    string doctor_id = 2;
    google.protobuf.Timestamp start_time = 3;
    google.protobuf.Timestamp end_time = 4;
    bool booked = 5;
}

message DoctorList{
    repeated Doctor doctors = 1;
}

message SlotList{
    repeated Slot slots = 1;
}